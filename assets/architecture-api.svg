<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="User API architecture">
  <rect width="880" height="220" rx="16" fill="#0c0f14"/>
  <rect x=".75" y=".75" width="878.5" height="218.5" rx="15.25" fill="none" stroke="#1c232c"/>
  <g font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#e8eaed">
    <rect x="40" y="78" width="140" height="64" rx="10" fill="#141a22" stroke="#2a3440"/>
    <text x="110" y="106" text-anchor="middle">Client</text>
    <text x="110" y="124" text-anchor="middle" fill="#8b939e" font-size="11">cURL / Postman</text>
    <rect x="250" y="78" width="150" height="64" rx="10" fill="#141a22" stroke="#2a3440"/>
    <text x="325" y="106" text-anchor="middle">Routes</text>
    <text x="325" y="124" text-anchor="middle" fill="#8b939e" font-size="11">HTTP + JWT</text>
    <rect x="470" y="78" width="150" height="64" rx="10" fill="#141a22" stroke="#2a3440"/>
    <text x="545" y="106" text-anchor="middle">Services</text>
    <text x="545" y="124" text-anchor="middle" fill="#8b939e" font-size="11">validation / logic</text>
    <rect x="690" y="78" width="150" height="64" rx="10" fill="#141a22" stroke="#7eb8c9" stroke-opacity=".5"/>
    <text x="765" y="106" text-anchor="middle">MySQL</text>
    <text x="765" y="124" text-anchor="middle" fill="#8b939e" font-size="11">users table</text>
  </g>
  <g stroke="#7eb8c9" stroke-width="1.4" fill="none">
    <path d="M180 110 H250"/>
    <path d="M400 110 H470"/>
    <path d="M620 110 H690"/>
  </g>
  <text x="440" y="44" text-anchor="middle" fill="#8b939e" font-family="Liberation Mono, monospace" font-size="12">user-api  ·  layered REST architecture</text>
</svg>
